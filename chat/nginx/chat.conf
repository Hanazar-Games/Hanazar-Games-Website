limit_req_zone $binary_remote_addr zone=hanazar_api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hanazar_feedback_per_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=hanazar_connections_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.hanazargames.com;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=hanazar_api_per_ip burst=30 nodelay;
    limit_conn hanazar_connections_per_ip 20;
    return 301 https://chat.hanazargames.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.hanazargames.com;
    ssl_certificate /etc/letsencrypt/live/chat.hanazargames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.hanazargames.com/privkey.pem;
    root /srv/hanazar-chat/current/public;
    index index.php;
    client_max_body_size 12M;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 35s;
    keepalive_timeout 15s;
    keepalive_requests 200;
    reset_timedout_connection on;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn hanazar_connections_per_ip 20;
    access_log off;

    # Dynamic endpoints emit Cache-Control "no-store" from PHP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param REQUEST_URI /api/health;
        fastcgi_pass unix:/run/php/hanazar-chat.sock;
    }

    location ^~ /api/feedbacks {
        limit_req zone=hanazar_feedback_per_ip burst=6 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 35s;
        fastcgi_read_timeout 35s;
        fastcgi_pass unix:/run/php/hanazar-chat.sock;
    }

    location /api/ {
        limit_req zone=hanazar_api_per_ip burst=30 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 35s;
        fastcgi_read_timeout 35s;
        fastcgi_pass unix:/run/php/hanazar-chat.sock;
    }

    location = /api/index.php {
        limit_req zone=hanazar_api_per_ip burst=30 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 35s;
        fastcgi_read_timeout 35s;
        fastcgi_pass unix:/run/php/hanazar-chat.sock;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }

    location = /index.php {
        limit_req zone=hanazar_api_per_ip burst=30 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_connect_timeout 3s;
        fastcgi_send_timeout 35s;
        fastcgi_read_timeout 35s;
        fastcgi_pass unix:/run/php/hanazar-chat.sock;
    }

    location ~ \.php$ { deny all; }
    location ~* /(?:storage|database|vendor|scripts|backups|\.env) { deny all; }
}
