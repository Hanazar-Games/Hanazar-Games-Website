[hanazar-chat]
user = hanazar-chat
group = hanazar-chat
listen = /run/php/hanazar-chat.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 10s
clear_env = yes
env[APP_ENV] = $APP_ENV
env[APP_ORIGIN] = $APP_ORIGIN
env[APP_HOST] = $APP_HOST
env[APP_KEY] = $APP_KEY
env[PUBLIC_ROOT] = $PUBLIC_ROOT
env[DB_PATH] = $DB_PATH
env[SESSION_PATH] = $SESSION_PATH
env[LOG_PATH] = $LOG_PATH
env[RATE_LIMIT_PATH] = $RATE_LIMIT_PATH
env[BACKUP_PATH] = $BACKUP_PATH
env[TRUSTED_PROXIES] = $TRUSTED_PROXIES
env[SHARE_ORIGINS] = $SHARE_ORIGINS
catch_workers_output = no
php_admin_flag[display_errors] = Off
php_admin_flag[log_errors] = On
php_admin_value[error_log] = /srv/hanazar-chat/shared/logs/php-error.log
php_admin_value[session.save_path] = /srv/hanazar-chat/shared/sessions
php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.use_only_cookies] = 1
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 96M
