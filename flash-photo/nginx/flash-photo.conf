log_format flash_photo_privacy '$time_iso8601 request_id=$request_id method=$request_method '
                               'status=$status bytes=$body_bytes_sent duration=$request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name s.hanazargames.com;
    access_log /var/log/nginx/flash-photo.access.log flash_photo_privacy;
    client_max_body_size 16k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location /v/ {
        access_log off;
        error_log /dev/null crit;
        return 301 https://s.hanazargames.com$request_uri;
    }

    location /api/ {
        access_log off;
        return 308 https://s.hanazargames.com$request_uri;
    }

    location / {
        return 301 https://s.hanazargames.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s.hanazargames.com;

    root /var/www/flash-photo/current/public;
    index index.php;
    access_log /var/log/nginx/flash-photo.access.log flash_photo_privacy;
    client_max_body_size 16k;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/s.hanazargames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s.hanazargames.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FlashPhotoTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Trusted reverse proxy only. The proxy must replace, not append an
    # untrusted client-supplied X-Forwarded-For value:
    # set_real_ip_from 10.0.0.10;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/flash-photo.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Tokens are bearer secrets embedded in the path: never access-log this route.
    location ~ "^/v/([A-Za-z0-9_-]{43})/?$" {
        access_log off;
        error_log /dev/null crit;
        log_not_found off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/view.php;
        fastcgi_param SCRIPT_NAME /view.php;
        fastcgi_param QUERY_STRING token=$1;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/flash-photo.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location /v/ {
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Pragma no-cache always;
        add_header Expires 0 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 404;
    }

    location ~ ^/api/(?:content|heartbeat|redeem|status)\.php$ {
        access_log off;
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
        fastcgi_buffering off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/flash-photo.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ ^/api/ {
        access_log off;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Pragma no-cache always;
        add_header Expires 0 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 404;
    }

    location = /health.php {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_param SCRIPT_NAME /health.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/flash-photo.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ ^/(?<flash_admin_prefix>admin)/?$ { return 302 /$flash_admin_prefix/login.php; }
    # Keep the admin URL prefix in these three regex locations synchronized with ADMIN_PATH. The physical
    # scripts always remain under public/admin/.
    location ~ ^/admin/upload\.php$ {
        client_max_body_size 11m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/upload.php;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/flash-photo.sock;
        fastcgi_hide_header X-Powered-By;

        # Optional second factor at the edge (keep both admin script locations aligned):
        # auth_basic "Flash Photo Admin";
        # auth_basic_user_file /etc/nginx/flash-photo.htpasswd;

        # Optional fixed-IP/Tailscale restriction (add every allowed address):
        # allow 203.0.113.10;
        # allow 100.101.102.103;
        # allow fd7a:115c:a1e0::1234;
        # deny all;
    }

    location ~ ^/admin/(?<flash_admin_script>index|login|logout|list|destroy)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/$flash_admin_script.php;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/flash-photo.sock;
        fastcgi_hide_header X-Powered-By;

        # Optional second factor at the edge (keep both admin script locations aligned):
        # auth_basic "Flash Photo Admin";
        # auth_basic_user_file /etc/nginx/flash-photo.htpasswd;

        # Optional fixed-IP/Tailscale restriction (add every allowed address):
        # allow 203.0.113.10;
        # allow 100.101.102.103;
        # allow fd7a:115c:a1e0::1234;
        # deny all;
    }

    location ~ ^/assets/(?:app\.css|viewer\.js|admin\.js)$ {
        try_files $uri =404;
        expires epoch;
        access_log off;
    }

    location /assets/ { return 404; }

    location = /favicon.svg {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    location ~ (^|/)\. { deny all; }
    location ~* \.(?:sqlite|sqlite3|db|log|env)(?:$|/) { deny all; }
    location ~ ^/(?:app|config|database|storage|scripts|tests|vendor|nginx)(?:/|$) { deny all; }
    location ~ ^/(?:composer\.(?:json|lock)|phpunit\.xml|README\.md|LICENSE)$ { deny all; }
    location ~ \.php(?:$|/) { return 404; }

    location / {
        try_files $uri =404;
    }
}
