<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Hanazar’s Note</title>
  <desc id="description">A violet notebook with a warm bookmark and handwritten H.</desc>
  <defs>
    <linearGradient id="cover" x1="92" y1="76" x2="416" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aaa2ff"/>
      <stop offset=".48" stop-color="#786ef0"/>
      <stop offset="1" stop-color="#4e44b9"/>
    </linearGradient>
    <linearGradient id="paper" x1="147" y1="126" x2="365" y2="393" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeecff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="337" y1="111" x2="337" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd38c"/>
      <stop offset="1" stop-color="#ff8d61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#27196b" flood-opacity=".32"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="82" y="57" width="348" height="398" rx="70" fill="url(#cover)"/>
    <rect x="126" y="96" width="263" height="319" rx="42" fill="url(#paper)"/>
    <path d="M161 96v319" fill="none" stroke="#d5d0f3" stroke-width="12"/>
    <path d="M298 96h78v196l-39-27-39 27V96Z" fill="url(#ribbon)"/>
    <path d="M205 201v122M205 261h74M279 201v122" fill="none" stroke="#665ad8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M204 361h98" fill="none" stroke="#a59ee7" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
