<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Hanazar’s Note</title>
  <desc id="description">A private notebook and bookmark on a violet workspace.</desc>
  <defs>
