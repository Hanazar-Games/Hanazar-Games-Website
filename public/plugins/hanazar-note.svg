      <stop stop-color="#25234d"/>
      <stop offset="0.5" stop-color="#4c48a9"/>
      <stop offset="1" stop-color="#19172f"/>
    </linearGradient>
    <linearGradient id="cover" x1="402" y1="154" x2="878" y2="574" gradientUnits="userSpaceOnUse">
