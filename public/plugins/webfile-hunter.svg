<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">WebFile Hunter</title>
  <desc id="description">A document under a search lens with connected web resources.</desc>
  <defs>
