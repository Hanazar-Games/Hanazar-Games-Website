<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">WebFile Hunter</title>
  <desc id="description">A web document inspected through a bright search lens.</desc>
  <defs>
    <linearGradient id="file" x1="90" y1="65" x2="370" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76f3dc"/>
      <stop offset="1" stop-color="#1ba9b9"/>
    </linearGradient>
    <linearGradient id="fold" x1="272" y1="83" x2="367" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c2fff3"/>
      <stop offset="1" stop-color="#6fe9db"/>
    </linearGradient>
    <linearGradient id="lens" x1="267" y1="269" x2="444" y2="447" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe290"/>
      <stop offset="1" stop-color="#ff9c53"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#07535d" flood-opacity=".3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M93 56h192l96 96v292H93c-21 0-38-17-38-38V94c0-21 17-38 38-38Z" fill="url(#file)"/>
    <path d="M285 56v96h96" fill="url(#fold)"/>
    <path d="M120 208h176M120 263h150M120 318h105" fill="none" stroke="#eafffb" stroke-width="18" stroke-linecap="round" opacity=".9"/>
    <circle cx="332" cy="337" r="89" fill="#0d6774" stroke="url(#lens)" stroke-width="24"/>
    <path d="m395 400 70 70" fill="none" stroke="url(#lens)" stroke-width="30" stroke-linecap="round"/>
    <path d="M299 337h66M332 304v66" fill="none" stroke="#b9fff1" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
